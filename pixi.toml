[workspace]
name = "pymfem-dgns-conda"
version = "4.9.0.post9"
description = "Reproducible builder for the DGNS PyMFEM Conda packages"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]
requires-pixi = ">=0.72.1"

[dependencies]
python = "3.12.*"
rattler-build = "0.69.*"

[activation.env]
PYMFEM_BUILD_NCPU = "2"
OMPI_MCA_rmaps_base_oversubscribe = "1"
MACOSX_DEPLOYMENT_TARGET = "13.0"

[tasks]
render-conda = "rattler-build build --recipe recipe/recipe.yaml --render-only --with-solve"
build-conda = "rattler-build build --recipe recipe/recipe.yaml --channel conda-forge --output-dir output --package-format conda --error-prefix-in-binary"
