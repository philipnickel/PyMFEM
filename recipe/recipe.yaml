context:
  version: 4.10.0.post3
  mfem_version: 4.10.0
  mfem_tag: v4.10
  mfem_commit: d964264cdb9a13e94a201b6c236c7721e0c8765f
  gslib_version: 1.0.9

recipe:
  name: dgns-mfem-stack
  version: ${{ version }}

source:
  # PyMFEM (this checkout)
  - path: ..
  # Stock upstream MFEM 4.10 release, no patches
  - git: https://github.com/mfem/mfem.git
    tag: ${{ mfem_tag }}
    target_directory: external/mfem
  # GSLIB, the version MFEM 4.10 fetches and Spack's mfem+gslib uses
  - url: https://github.com/Nek5000/gslib/archive/refs/tags/v${{ gslib_version }}.tar.gz
    sha256: 572c78b1ca4ddda75ec85c6299ee0597459f4dbf5170b9faa6de4c435dcdc80b
    target_directory: external/gslib

build:
  number: 0

outputs:
  # --------------------------------------------------------------------------
  # MFEM C++ library: headers, libmfem, GSLIB, config.mk and MFEMConfig.cmake
  # --------------------------------------------------------------------------
  - package:
      name: mfem-dgns
      version: ${{ version }}
    build:
      script: build_mfem.sh
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - if: linux
          then: gcc_linux-64 14.*
        - if: linux
          then: gxx_linux-64 14.*
        - cmake >=3.24
        - make
      host:
        - openmpi 5.0.10.*
        - hypre 3.2.*
        - metis 5.*
        - zlib
        - libblas
        - liblapack
      run:
        - openmpi 5.0.10.*
        - hypre 3.2.*
        - metis 5.*
        - zlib
      run_exports:
        - ${{ pin_subpackage('mfem-dgns', exact=True) }}
    tests:
      - package_contents:
          include:
            - mfem.hpp
            - mfem/config/_config.hpp
            - gslib.h
          lib:
            - mfem
          files:
            - lib/cmake/mfem/MFEMConfig.cmake
            - share/mfem/config.mk
            - lib/libgs.a
      - script:
          - grep -q '^#define MFEM_USE_MPI' $PREFIX/include/mfem/config/_config.hpp
          - grep -q '^#define MFEM_USE_GSLIB' $PREFIX/include/mfem/config/_config.hpp
          - "! grep -q '^#define MFEM_THREAD_SAFE' $PREFIX/include/mfem/config/_config.hpp"
          - "! grep -q '^#define MFEM_USE_MPFR' $PREFIX/include/mfem/config/_config.hpp"
          - "! grep -q '^#define MFEM_USE_CEED' $PREFIX/include/mfem/config/_config.hpp"
          - cmake -S recipe/test-cmake -B build-consumer -DCMAKE_BUILD_TYPE=Release
          - cmake --build build-consumer
          - env OMPI_MCA_rmaps_base_oversubscribe=1 mpiexec -n 2 build-consumer/parmesh_smoke
        requirements:
          run:
            - ${{ compiler('cxx') }}
            - cmake >=3.24
            - make
        files:
          source:
            - recipe/test-cmake/

  # --------------------------------------------------------------------------
  # PyMFEM parallel wrapper (Python module `mfem`, `mfem.par`) on mfem-dgns
  # --------------------------------------------------------------------------
  - package:
      name: pymfem-dgns
      version: ${{ version }}
    build:
      script: build_pymfem.sh
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - if: linux
          then: gcc_linux-64 14.*
        - if: linux
          then: gxx_linux-64 14.*
        - make
        - git
        - swig 4.5.*
      host:
        - ${{ pin_subpackage('mfem-dgns', exact=True) }}
        - python
        - pip >=25.1
        - setuptools >=80
        - wheel
        - packaging
        - numpy >=2.4.1,<3
        - openmpi 5.0.10.*
        - mpi4py 4.1.2.*
        - hypre 3.2.*
        - metis 5.*
        - zlib
      run:
        - ${{ pin_subpackage('mfem-dgns', exact=True) }}
        - python
        - numpy >=2.4.1,<3
        - scipy
        - numba
        - openmpi 5.0.10.*
        - mpi4py 4.1.2.*
    tests:
      - python:
          imports:
            - mfem.par
          pip_check: true
      - script:
          - python ci/validate_install.py par
          - env OMPI_MCA_rmaps_base_oversubscribe=1 mpiexec -n 2 python ci/mpi_smoke.py
        files:
          source:
            - ci/validate_install.py
            - ci/mpi_smoke.py

about:
  homepage: https://github.com/philipnickel/PyMFEM
  repository: https://github.com/philipnickel/PyMFEM
  documentation: https://pymfem.readthedocs.io/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Stock MFEM 4.10 C++ library and parallel PyMFEM for DGNS
  description: |
    Two outputs built from one stock upstream MFEM 4.10 source tree (no patches):
    mfem-dgns (C++ headers, shared libmfem, GSLIB, MFEMConfig.cmake) and
    pymfem-dgns (parallel-only PyMFEM wrapper linked against mfem-dgns).
    MPI, METIS, zlib, LAPACK and GSLIB are enabled; MPFR, thread safety,
    libCEED, OpenMP and GPU backends are not. OpenMPI, mpi4py and HYPRE come
    from Conda-forge.

extra:
  mfem_tag: ${{ mfem_tag }}
  mfem_commit: ${{ mfem_commit }}
  supported_platforms:
    - linux-64
    - osx-arm64
