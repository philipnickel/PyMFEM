name: Publish DGNS Conda packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'dgns-v*'

permissions:
  contents: read

env:
  PREFIX_CHANNEL: philipnickel/philipnickel-dgns
  RELEASE_VERSION: 4.10.0.post3

jobs:
  build:
    name: ${{ matrix.target-platform }} | Python 3.14 | MPI, stock MFEM 4.10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target-platform: linux-64
          - runner: macos-14
            target-platform: osx-arm64
    runs-on: ${{ matrix.runner }}
    env:
      PYMFEM_BUILD_NCPU: '2'
      MACOSX_DEPLOYMENT_TARGET: '13.0'

    steps:
      - name: Checkout the triggering fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the locked package builder
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347
        with:
          pixi-version: v0.73.0
          frozen: true
          cache: true

      - name: Validate the release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          expected="dgns-v${RELEASE_VERSION}"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME does not match recipe version $expected" >&2
            exit 1
          }

      - name: Render the recipe
        run: pixi run rattler-build build --recipe recipe/recipe.yaml --target-platform ${{ matrix.target-platform }} --render-only

      - name: Build and test the Conda package
        run: pixi run rattler-build build --recipe recipe/recipe.yaml --target-platform ${{ matrix.target-platform }} --channel conda-forge --output-dir output --package-format conda --error-prefix-in-binary

      - name: Upload native package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dgns-packages-${{ matrix.target-platform }}
          path: output/${{ matrix.target-platform }}/*.conda
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable packages to Prefix.dev
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout packaging configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the locked package publisher
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347
        with:
          pixi-version: v0.73.0
          frozen: true
          cache: true

      - name: Download all native packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dgns-packages-*
          path: packages
          merge-multiple: true

      - name: Validate the release set
        shell: bash
        run: |
          mapfile -t packages < <(find packages -type f -name '*.conda' -print | sort)
          test "${#packages[@]}" -eq 4 || {
            printf 'Expected four packages, found %s\n' "${#packages[@]}" >&2
            printf '%s\n' "${packages[@]}" >&2
            exit 1
          }
          printf '%s\n' "${packages[@]}"

      - name: Publish with trusted OIDC identity and attestations
        shell: bash
        run: |
          while IFS= read -r package; do
            pixi run rattler-build upload prefix \
              --channel "${PREFIX_CHANNEL}" \
              --generate-attestation \
              "$package"
          done < <(find packages -type f -name '*.conda' -print | sort)
